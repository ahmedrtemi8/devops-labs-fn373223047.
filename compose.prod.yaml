services:
  app:
    image: ghcr.io/ahmedrtemi8/devops-labs-fn373223047:${APP_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://notes:ci-only@postgres:5432/notes
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: notes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
