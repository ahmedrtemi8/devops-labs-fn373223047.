cat << 'EOF' > .github/workflows/ci.yml
name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://notes:ci-only@localhost:5432/notes
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/ahmedrtemi8/devops-labs-fn373223047" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Smoke test container
        run: |
          docker run -d --name notes-api -p 8000:8000 "$IMAGE:${{ github.sha }}"
          sleep 3
          curl --fail http://localhost:8000/docs
          docker stop notes-api

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Push to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
            docker push "$IMAGE:${{ github.ref_name }}"
          fi
